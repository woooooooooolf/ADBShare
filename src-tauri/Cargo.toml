[package]
name = "adbshare"
version = "0.8.0"
edition = "2021"
description = "Portable LAN ADB device sharing"
authors = ["wooooooooolf"]
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
if-addrs = "0.15"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
